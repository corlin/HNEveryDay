name = "hneveryday-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_TEAM_ID = "5M726V7N7X"
APP_BUNDLE_ID = "cn.corlin.hneveryday.HNEveryDay"
# off | soft | enforce  (see docs/PRO_PAYWALL_AND_BACKEND_SPEC.md §7)
ATTEST_MODE = "soft"
# testing phase: set back to "false" before App Store release
ALLOW_DEV_ATTEST = "true"
# testing phase: set back to "false" before App Store release
ALLOW_SANDBOX = "true"
LLM_BASE_URL = "https://api.deepseek.com"
LLM_MODEL = "deepseek-v4-flash"
DAILY_TOKEN_BUDGET = "20000000"
PREWARM_LANGS = "zh-Hans"
MAX_DEVICES_PER_SUBSCRIPTION = "5"
PRO_PRODUCT_IDS = "cn.corlin.hneveryday.pro.monthly,cn.corlin.hneveryday.pro.annual"

# Secrets (wrangler secret put ...):
#   LLM_API_KEY      hosted model provider key
#   TOKEN_SECRET     HMAC key for device tokens (>= 32 random bytes)
#   ADMIN_TOKEN      bearer token for /api/v1/admin/*
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY   optional, App Store Server API

[[d1_databases]]
binding = "DB"
database_name = "hneveryday"
database_id = "1a55ea22-5d17-4ea2-a9f8-d925c0a290f0"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CONFIG"
id = "c7fb7cd944c849069ec6562cf19c6b03"

[[durable_objects.bindings]]
name = "COALESCER"
class_name = "GenerationCoalescer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GenerationCoalescer"]

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
